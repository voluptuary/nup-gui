name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: ['gui']
    tags: ['v*']
  pull_request:
    branches: ['gui']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build NUP GUI
        shell: pwsh
        run: ./tools/nup/build_windows.ps1
      - name: Smoke test the Windows GUI event loop
        run: python tools/nup/smoke_gui.py dist/nup-gui.exe
      - name: Verify pack and unpack preserve file bytes
        run: python -m unittest discover -s tools/nup/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nup-gui-windows-x64
          path: dist/nup-gui-windows-x64.zip
          if-no-files-found: error
